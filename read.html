<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibraDars - Tamil Books Collection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style1.css">
    <link rel="icon" type="image/png" href="l18.png">

    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1507842229443-77783618cdc3?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        /* Top Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 20, 0.9);
            padding: 12px 30px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #f1f2f6;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            color: #a4b0be;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #6c5ce7;
        }
        .logout-btn {
            background-color: #ff4757;
            color: white;
            padding: 6px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: background 0.3s;
        }
        .logout-btn:hover {
            background-color: #ff6b81;
        }

        /* Title & Search */
        h2.section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 15px 0;
            color: #f1f2f6;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .search-box-container {
            margin: 20px auto 30px auto;
            max-width: 600px;
            display: flex;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 30px;
            padding: 6px 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            border: 1px solid #3f3f3f;
        }
        .search-box-container input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 10px;
            font-size: 0.95rem;
        }
        .search-box-container button {
            background: #f19066;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        .search-box-container button:hover {
            background: #e17055;
        }

        /* Books Grid Display */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            text-align: left;
        }
        .book-card {
            background: rgba(25, 25, 25, 0.9);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3);
        }
        .book-img-box {
            height: 180px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }
        .book-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .book-card:hover .book-img-box img {
            transform: scale(1.05);
        }
        .book-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(108, 92, 231, 0.9);
            color: white;
            padding: 3px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            font-weight: 500;
        }
        .book-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .book-info h4 {
            margin: 0;
            font-size: 1.05rem;
            color: #f1f2f6;
            font-family: 'Playfair Display', serif;
        }
        .book-author {
            font-size: 0.8rem;
            color: #a4b0be;
        }
        .book-story {
            font-size: 0.82rem;
            color: #2ed573;
            font-style: italic;
            margin: 4px 0 10px 0;
            line-height: 1.4;
            flex: 1;
        }
        .read-btn {
            background-color: #6c5ce7;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.3s;
            display: block;
        }
        .read-btn:hover {
            background-color: #5b4bc4;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Navbar -->

            </div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>

        <!-- Section Title & Search -->

                file: "books/periya-puranam.pdf"
            }
        ];

        // Render Tamil Books
        function displayBooks(booksToDisplay) {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = "";

            if (booksToDisplay.length === 0) {
                grid.innerHTML = `<p style="color: #a4b0be; grid-column: 1/-1; text-align: center; padding: 40px;">No Tamil books found matching your search.</p>`;
                return;
            }

            booksToDisplay.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-img-box">
                        <img src="${book.image}" alt="${book.title}">
                        <span class="book-badge">${book.category}</span>
                    </div>
                    <div class="book-info">
                        <h4>${book.title}</h4>
                        <span class="book-author"><i class="fa-solid fa-pen-nib"></i> ${book.author}</span>
                        <p class="book-story">"${book.story}"</p>
                        <a href="read.html?title=${encodeURIComponent(book.title)}&file=${encodeURIComponent(book.file)}" class="read-btn">
                            <i class="fa-solid fa-book-open-reader"></i> Read Book
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Search Books Function
        function searchBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = tamilBooksData.filter(b => 
                b.title.toLowerCase().includes(query) || 
                b.author.toLowerCase().includes(query) ||
                b.story.toLowerCase().includes(query)
            );
            document.getElementById('collectionTitle').innerText = `Search Results (${filtered.length} Books)`;
            displayBooks(filtered);
        }

        // Initial Load
        window.onload = function() {
            displayBooks(tamilBooksData);
        };

</html>
